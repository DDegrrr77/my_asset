<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate" />
    <title>Snow Ball - 자산 관리</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=5" />
    <link rel="icon" type="image/png" href="/icon-192.png?v=5" />
    <link rel="apple-touch-icon" href="/icon-512.png?v=5" />
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#111827">
    <!-- iOS PWA Standalone Mode Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Snow Ball">
    <!-- Android / Mobile Layout Options -->
    <meta name="mobile-web-app-capable" content="yes">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').then((registration) => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, (err) => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
