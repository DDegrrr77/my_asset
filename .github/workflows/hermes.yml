name: Hermes Auto Asset Updater

on:
  schedule:
    # 매주 월~금 한국 시간 오후 4시(장 마감 후) 실행 (UTC 07:00)
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 활성화

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 패키지 설치
        run: |
          pip install requests beautifulsoup4

      - name: 헤르메스 에이전트 실행
        env:
          WT_GITHUB_TOKEN: ${{ secrets.WT_GITHUB_TOKEN }}
          WT_GIST_ID: ${{ secrets.WT_GIST_ID }}
        run: |
          python hermes_agent.py
